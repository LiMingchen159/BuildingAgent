name: Developer documentation site

on:
  pull_request:
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete documentation baseline
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Test documentation build helpers
        run: python -m unittest discover -s scripts/docs -p '*_test.py' -v

      - name: Build documentation in strict mode
        run: mkdocs build --strict --clean

      - name: Check generated links and assets
        run: python scripts/docs/check_built_site.py site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published bilingual documentation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          page_base="${PAGE_URL%/}"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$page_base/" --output "$verification_dir/index.html"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$page_base/developer/zh-CN/" --output "$verification_dir/zh.html"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$page_base/developer/en/" --output "$verification_dir/en.html"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$page_base/search/search_index.json" --output "$verification_dir/search.json"
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 "$page_base/assets/diagrams/target-architecture.drawio.svg" --output "$verification_dir/architecture.svg"
          grep --fixed-strings --quiet 'BuildingAgent Developer Documentation' "$verification_dir/index.html"
          grep --fixed-strings --quiet 'BuildingAgent 开发者文档' "$verification_dir/zh.html"
          grep --fixed-strings --quiet 'BuildingAgent developer documentation' "$verification_dir/en.html"
          grep --fixed-strings --quiet '"docs"' "$verification_dir/search.json"
          test -s "$verification_dir/architecture.svg"
